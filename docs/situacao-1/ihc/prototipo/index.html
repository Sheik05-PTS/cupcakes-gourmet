<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupcakes Gourmet — Protótipo de Telas</title>
<style>
:root {
  --berry: #9c2f5b; --berry-dark: #7a2147; --rose: #f7dbe4; --rose-soft: #fcf0f4;
  --cream: #fff9f5; --card: #ffffff; --ink: #2a1f24; --muted: #75656c; --line: #eadde2;
  --ok: #276b45; --ok-bg: #e3f3e9; --warn: #7c5200; --warn-bg: #fff2d1;
  --err: #b3261e; --err-bg: #fce9e7; --info: #2b5797; --info-bg: #e9f0fb;
  --radius: 14px;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #ecebef; color: var(--ink); }
.galeria { display: flex; flex-wrap: wrap; gap: 36px 28px; padding: 28px; }
.galeria figure { margin: 0; }
.galeria figcaption { font-size: 13px; margin-top: 8px; color: #444; max-width: 380px; }
.galeria figcaption b { color: var(--ink); }
body.unica { background: transparent; }
body.unica .galeria { padding: 0; }
body.unica figcaption { display: none; }

/* aparelho */
.phone { width: 380px; height: 780px; border: 10px solid #1d1b1e; border-radius: 42px; background: var(--cream);
  overflow: hidden; position: relative; display: flex; flex-direction: column; }
.status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center;
  padding: 0 22px; font-size: 13px; font-weight: 600; }
.status .sinais { display: flex; gap: 5px; align-items: center; }
.status .sinais i { display: block; width: 3px; background: var(--ink); border-radius: 1px; }
.status .bateria { width: 22px; height: 11px; border: 1.5px solid var(--ink); border-radius: 3px; position: relative; }
.status .bateria::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--ink); border-radius: 1px; }

.appbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: var(--cream); }
.appbar h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 650; }
.appbar .marca { font-size: 18px; font-weight: 750; color: var(--berry); letter-spacing: -.2px; flex: 1; }
.appbar .marca small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.icone-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; position: relative; color: var(--ink); }
.badge { position: absolute; top: 1px; right: 0; min-width: 17px; height: 17px; border-radius: 9px; background: var(--berry);
  color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.p { width: 16px; height: 16px; }

.conteudo { flex: 1; overflow: hidden; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.rodape-acao { flex: none; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--card); }

.tabbar { height: 62px; flex: none; display: flex; border-top: 1px solid var(--line); background: var(--card); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; color: var(--muted); text-decoration: none; }
.tabbar a.ativo { color: var(--berry); font-weight: 650; }

/* tipografia e utilitários */
h2 { font-size: 15px; margin: 0; }
.sub { color: var(--muted); font-size: 12.5px; }
.preco { font-weight: 700; }
.linha { display: flex; align-items: center; gap: 8px; }
.entre { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sep { height: 1px; background: var(--line); margin: 2px 0; }
p { margin: 0; font-size: 13.5px; line-height: 1.45; }

/* botões */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px;
  font-size: 15px; font-weight: 650; border: 0; width: 100%; }
.btn.prim { background: var(--berry); color: #fff; }
.btn.sec { background: var(--card); color: var(--berry); border: 1.5px solid var(--berry); }
.btn.perigo { background: var(--card); color: var(--err); border: 1.5px solid var(--err); }
.btn.desab { background: #d9d1d4; color: #fff; }
.btn.peq { height: 36px; font-size: 13.5px; width: auto; padding: 0 14px; }
.link { color: var(--berry); font-weight: 600; font-size: 13.5px; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--card);
  font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--rose); border-color: var(--berry); color: var(--berry-dark); font-weight: 600; }

/* vitrine */
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; position: relative; }
.card .img { height: 104px; display: grid; place-items: center; }
.card .img svg { width: 84px; height: 84px; }
.card .info { padding: 8px 10px 10px; }
.card .nome { font-size: 13px; font-weight: 600; line-height: 1.25; height: 33px; overflow: hidden; }
.card .acoes { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.mais { width: 30px; height: 30px; border-radius: 9px; background: var(--berry); color: #fff; display: grid; place-items: center; }
.esgotado .img { filter: grayscale(.9); opacity: .55; }
.tarja { position: absolute; top: 8px; left: 8px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 700;
  padding: 3px 7px; border-radius: 6px; letter-spacing: .3px; }
.tag-min { font-size: 10.5px; color: var(--muted); }

/* formulários */
.campo { display: flex; flex-direction: column; gap: 5px; }
.campo label { font-size: 12.5px; font-weight: 600; }
.input { height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); display: flex;
  align-items: center; padding: 0 12px; font-size: 14px; color: var(--ink); gap: 8px; }
.input.vazio { color: #a99aa0; }
.input.foco { border-color: var(--berry); }
.input.erro { border-color: var(--err); }
.msg-campo { font-size: 12px; color: var(--err); display: flex; gap: 4px; align-items: center; }
.ajuda { font-size: 12px; color: var(--muted); }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.contador { font-size: 11.5px; color: var(--muted); text-align: right; }

/* avisos */
.aviso { border-radius: 10px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 8px; line-height: 1.4; align-items: flex-start; }
.aviso svg { flex: none; margin-top: 1px; }
.aviso.ok { background: var(--ok-bg); color: var(--ok); }
.aviso.warn { background: var(--warn-bg); color: var(--warn); }
.aviso.err { background: var(--err-bg); color: var(--err); }
.aviso.info { background: var(--info-bg); color: var(--info); }

/* listas e caixas */
.caixa { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: flex-start; }
.thumb { width: 54px; height: 54px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.thumb svg { width: 44px; height: 44px; }
.item .meio { flex: 1; min-width: 0; }
.item .nome { font-size: 13.5px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 9px; height: 32px; }
.stepper span { width: 30px; text-align: center; font-size: 14px; }
.stepper b { width: 26px; text-align: center; font-size: 13.5px; }
.resumo div { display: flex; justify-content: space-between; font-size: 13.5px; padding: 2px 0; }
.resumo .total { font-size: 16px; font-weight: 750; padding-top: 6px; }
.desconto { color: var(--ok); }

.radio { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
.radio.on { border-color: var(--berry); background: var(--rose-soft); }
.bolinha { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #b7a8ae; flex: none; margin-top: 1px; }
.radio.on .bolinha { border: 5px solid var(--berry); }

.segment { display: flex; background: #efe6ea; border-radius: 11px; padding: 3px; }
.segment span { flex: 1; text-align: center; height: 36px; display: grid; place-items: center; font-size: 14px; border-radius: 9px; color: var(--muted); font-weight: 600; }
.segment span.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; padding: 3px 8px; border-radius: 11px; white-space: nowrap; }
.pill.aguard { background: var(--warn-bg); color: var(--warn); }
.pill.pago { background: var(--info-bg); color: var(--info); }
.pill.preparo { background: var(--rose); color: var(--berry-dark); }
.pill.saiu { background: #ece6fb; color: #5a3fa0; }
.pill.entregue { background: var(--ok-bg); color: var(--ok); }
.pill.cancel { background: #eee; color: #555; }
.pill.novo { background: var(--berry); color: #fff; }

/* linha do tempo */
.timeline { display: flex; flex-direction: column; }
.passo { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
.passo:last-child { padding-bottom: 0; }
.passo::before { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--line); }
.passo:last-child::before { display: none; }
.passo.feito::before { background: var(--berry); }
.marco { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #efe8eb; color: #a3949a; }
.passo.feito .marco { background: var(--berry); color: #fff; }
.passo.atual .marco { background: var(--card); color: var(--berry); border: 2px solid var(--berry); }
.passo .txt b { display: block; font-size: 13.5px; }
.passo .txt span { font-size: 12px; color: var(--muted); }
.passo.pend .txt b { color: #a3949a; font-weight: 500; }

/* sobreposições */
.escurece { position: absolute; inset: 30px 0 0 0; background: rgba(30,20,25,.45); }
.folha { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cream); border-radius: 20px 20px 0 0;
  padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.folha .alca { width: 40px; height: 5px; border-radius: 3px; background: #d8ccd1; margin: 0 auto 2px; }
.dialogo { position: absolute; left: 24px; right: 24px; top: 250px; background: var(--card); border-radius: 18px; padding: 18px;
  display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.snackbar { position: absolute; left: 14px; right: 14px; bottom: 92px; background: #2d2428; color: #fff; border-radius: 12px;
  padding: 12px 14px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
.snackbar b { color: #f6b3c8; }

.vazio-estado { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 0 20px; }
.vazio-estado .circ { width: 96px; height: 96px; border-radius: 50%; background: var(--rose-soft); display: grid; place-items: center; }
.vazio-estado .circ svg { width: 64px; height: 64px; }
.vazio-estado h2 { font-size: 17px; }

.toggle { width: 40px; height: 24px; border-radius: 12px; background: var(--berry); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; right: 3px; }
.toggle.off { background: #cfc5c9; }
.toggle.off::after { right: auto; left: 3px; }
.tabela-admin .lin { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tabela-admin .lin:last-child { border-bottom: 0; }
.qr { width: 150px; height: 150px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.codigo { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; background: #f3edf0; border-radius: 8px; padding: 9px 10px; word-break: break-all; color: #4b3d43; }
</style>
</head>
